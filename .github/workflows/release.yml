name: Build and Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（如 v1.0.0）"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build EXE
        run: pyinstaller --onefile --console --name JiangNanSkills-Setup tools/install_jiangnan_skills.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/JiangNanSkills-Setup.exe

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build DMG
        run: bash tools/build_release/build_macos.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/JiangNanSkills-macOS.dmg

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: JiangNanSkills ${{ steps.tag.outputs.tag }}
          body: |
            ## JiangNanSkills — 江南写作技能安装器

            ### Windows（双击即可使用）
            - `JiangNanSkills-Setup.exe`：双击运行，按提示选择项目路径；
              若电脑上没有 Agent CLI（claude/codex/opencode），会自动优先安装 opencode

            ### macOS（安装 DMG 即可使用）
            - `JiangNanSkills-macOS.dmg`：内含「江南技能安装.app」与 CLI 工具 `jiangnan-skills`

            ### 特性
            - 技能来源为远程仓库，自动拉取最新版本
            - 项目隔离：只在指定项目激活，其他项目不受影响
            - 内容不入库：技能实体仅存于系统缓存，项目内为链接
            - 卸载 `--uninstall` 即停用
          files: |
            artifacts/JiangNanSkills-Setup.exe
            artifacts/JiangNanSkills-macOS.dmg
